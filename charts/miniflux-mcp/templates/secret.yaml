{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miniflux-mcp.secretName" . }}
  labels:
    {{- include "miniflux-mcp.labels" . | nindent 4 }}
type: Opaque
{{- if or .Values.mcp.authToken .Values.miniflux.apiKey .Values.miniflux.username .Values.miniflux.password }}
stringData:
  {{- if .Values.mcp.authToken }}
  {{ .Values.secretKeys.mcpAuthToken | quote }}: {{ .Values.mcp.authToken | quote }}
  {{- end }}
  {{- if .Values.miniflux.apiKey }}
  {{ .Values.secretKeys.minifluxApiKey | quote }}: {{ .Values.miniflux.apiKey | quote }}
  {{- end }}
  {{- if .Values.miniflux.username }}
  {{ .Values.secretKeys.minifluxUsername | quote }}: {{ .Values.miniflux.username | quote }}
  {{- end }}
  {{- if .Values.miniflux.password }}
  {{ .Values.secretKeys.minifluxPassword | quote }}: {{ .Values.miniflux.password | quote }}
  {{- end }}
{{- else }}
stringData: {}
{{- end }}
{{- end }}
